name: Publish CLI to npm registries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build CLI tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if @zcus/9router-v2 already published
        id: skip
        run: |
          ver=$(node -p "require('./cli/package.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if npm view @zcus/9router-v2@$ver version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install root deps (Next.js build)
        if: steps.skip.outputs.already == 'false'
        run: npm install

      - name: Install CLI deps (esbuild)
        if: steps.skip.outputs.already == 'false'
        working-directory: cli
        run: npm install

      - name: Build dashboard + standalone + MITM server
        if: steps.skip.outputs.already == 'false'
        working-directory: cli
        run: npm run build

      - name: Pack tarball
        if: steps.skip.outputs.already == 'false'
        working-directory: cli
        run: npm pack --pack-destination ..

      - name: Upload tarball
        if: steps.skip.outputs.already == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cli-tarball
          path: zcus-9router-v2-*.tgz

  publish-npmjs:
    name: Publish @zcus/9router-v2 → npmjs
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-tarball
          path: tarball

      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org/

      - name: Skip if already published
        id: check
        run: |
          ver=$(ls tarball | sed -E 's/.*-([0-9][^.]*)\.tgz/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if npm view @zcus/9router-v2@$ver version >/dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish tarball
        if: steps.check.outputs.skipped == 'false'
        run: npm publish ./tarball/zcus-9router-v2-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-ghcr-packages:
    name: Publish @zcus0/9router-v2 → GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_PUBLISH_PAT: ${{ secrets.GH_PUBLISH_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-tarball
          path: tarball

      - uses: actions/setup-node@v4
        with:
          registry-url: https://npm.pkg.github.com/

      - name: Skip if already published
        id: check
        run: |
          ver=$(ls tarball | sed -E 's/.*-([0-9][^.]*)\.tgz/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if npm view @zcus0/9router-v2@$ver version >/dev/null 2>&1; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite scope and publish
        if: ${{ steps.check.outputs.skipped == 'false' && env.GH_PUBLISH_PAT != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
        run: |
          cd tarball
          mkdir -p pkg && tar -xzf zcus-9router-v2-*.tgz -C pkg
          node -e "const fs=require('fs');const p='pkg/package/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.name='@zcus0/9router-v2';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          tar -czf zcus0-9router-v2.tgz -C pkg package
          npm publish ./zcus0-9router-v2.tgz --registry=https://npm.pkg.github.com/