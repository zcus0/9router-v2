services:
  9router-v2:
    image: zcus0/9router-v2:latest
    container_name: 9router-v2
    restart: always
    ports:
      - "20135:20135"
    volumes:
      - 9router-v2-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20135"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  9router-v2-data:
    name: 9router-v2-data