services:
  9router-v2:
    image: zcus0/9router-v2:latest
    container_name: 9router-v2
    restart: always
    ports:
      - "20135:20135"
    volumes:
      - 9router-v2-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20135"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Optional heap cap; raise on bigger VPSes.
      NODE_OPTIONS: "--max-old-space-size=512"
      # Headroom compression proxy is off by default and dashboard-managed
      # (started on demand under DATA_DIR). To use an external one, uncomment:
      # HEADROOM_URL: http://host.docker.internal:8787

volumes:
  9router-v2-data:
    name: 9router-v2-data